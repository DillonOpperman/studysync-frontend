buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

/**
 * AGP lint's extract*Annotations uses Java Flight Recorder. Some Windows JDKs
 * (and Cursor sandbox VMs) throw "Flight Recorder is not supported on this VM"
 * while assembling debug AARs for libraries such as react-native-keychain.
 * That task is for publishing library artifacts, not the app APK or Keychain
 * runtime. Disable it so assembleDebug can finish without removing Keychain.
 */
subprojects { sub ->
    ["debug/extractDebugAnnotations", "release/extractReleaseAnnotations"].each { path ->
        def file = new File(sub.buildDir, "intermediates/annotations_typedef_file/${path}/typedefs.txt")
        file.parentFile.mkdirs()
        if (!file.exists()) {
            file.createNewFile()
        }
    }
    sub.tasks.configureEach { task ->
        if (task.name == "extractDebugAnnotations" || task.name == "extractReleaseAnnotations") {
            task.enabled = false
        }
    }
}
